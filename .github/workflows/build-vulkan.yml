name: Build and Push Vulkan Variant to GHCR

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.vulkan
      - start-vulkan.sh
      - .github/workflows/build-vulkan.yml
  # Pull requests run the build and smoke test, but don't push
  pull_request:
    paths:
      - Dockerfile.vulkan
      - start-vulkan.sh
      - .github/workflows/build-vulkan.yml
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=vulkan
            type=raw,value=vulkan-${{ github.run_number }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build for smoke test
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile.vulkan
          load: true
          tags: smoke-test:vulkan
          cache-from: type=gha,scope=vulkan
          cache-to: type=gha,mode=max,scope=vulkan

      - name: Smoke test (server starts, API responds)
        run: |
          docker run -d --name smoke -p 11434:11434 smoke-test:vulkan
          ok=0
          for i in $(seq 1 30); do
            if curl -fs http://localhost:11434/api/version; then ok=1; break; fi
            sleep 2
          done
          echo
          docker logs smoke
          [ "$ok" = "1" ]

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile.vulkan
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vulkan
          cache-to: type=gha,mode=max,scope=vulkan
