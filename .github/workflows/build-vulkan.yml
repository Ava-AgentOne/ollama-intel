name: Build and Push Vulkan Variant to GHCR

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.vulkan
      - start-vulkan.sh
      - .github/workflows/build-vulkan.yml
  # Pull requests run the build and smoke test, but don't push
  pull_request:
    paths:
      - Dockerfile.vulkan
      - start-vulkan.sh
      - .github/workflows/build-vulkan.yml
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=vulkan
            type=raw,value=vulkan-${{ github.run_number }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.vulkan
          load: true
          tags: smoke-test:vulkan
          cache-from: type=gha,scope=vulkan
          cache-to: type=gha,mode=max,scope=vulkan

      - name: Smoke test (server starts, API responds)
        run: |
          docker run -d --name smoke -p 11434:11434 smoke-test:vulkan
          ok=0
          for i in $(seq 1 30); do
            if curl -fs http://localhost:11434/api/version; then ok=1; break; fi
            sleep 2
          done
          echo
          docker logs smoke
          [ "$ok" = "1" ]

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.vulkan
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vulkan
          cache-to: type=gha,mode=max,scope=vulkan
